<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Reader</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
            flex-direction: column;
        }
        .btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }
        .btn:hover {
            background-color: #45a049;
        }
        #qr-code-reader {
            width: 100%;
            height: 400px; /* Make the camera container visible */
            max-width: 400px;
            display: none;
            border: 2px solid #ddd;
            border-radius: 8px;
        }
        #qr-result {
            margin-top: 20px;
            padding: 10px;
            width: 100%;
            max-width: 400px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            text-align: center;
            word-wrap: break-word;
        }
    </style>
</head>
<body>
    <button class="btn" onclick="startScanner()">Open Camera & Scan QR Code</button>

    <div id="qr-code-reader"></div>
    <div>
        <label for="qr-result">QR Code Result:</label>
        <input type="text" id="qr-result" readonly placeholder="QR Code Result will appear here">
    </div>

    <!-- Include the html5-qrcode library -->
    <script src="https://unpkg.com/html5-qrcode/minified/html5-qrcode.min.js"></script>

    <script>
        function startScanner() {
            const qrCodeReader = document.getElementById('qr-code-reader');
            const qrResult = document.getElementById('qr-result');
            
            // Show the camera view container
            qrCodeReader.style.display = 'block';

            // Create a QRCodeScanner instance
            const qrCodeScanner = new Html5QrcodeScanner("qr-code-reader", {
                fps: 10, // Frames per second for scanning
                qrbox: 250, // Size of the QR code scanning box
            });

            // Start the QR code scanning
            qrCodeScanner.render(
                function(decodedText, decodedResult) {
                    // When QR code is successfully decoded, display the result in the input field
                    qrResult.value = decodedText;
                    qrCodeScanner.clear(); // Stop scanning after success
                    qrCodeReader.style.display = 'none'; // Hide camera view after scanning
                },
                function(errorMessage) {
                    // Handle scanning errors (e.g., no QR code detected)
                    console.warn("QR Code scanning error: ", errorMessage);
                }
            );
        }
    </script>
</body>
</html>
