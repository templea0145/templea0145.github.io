<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code Scanner</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      margin-bottom: 20px;
    }
    #qr-reader {
      width: 100%;
      max-width: 400px;
      margin: 0 auto;
      display: none;
    }
    #qr-code-list {
      margin-top: 20px;
    }
    li {
      font-size: 18px;
      list-style-type: none;
      margin: 5px 0;
    }
  </style>
</head>
<body>
  <h1>QR Code Scanner</h1>
  <button id="start-scan">Scan QR Code</button>
  <div id="qr-reader"></div>
  
  <ul id="qr-code-list"></ul>

  <!-- Include the html5-qrcode library -->
  <script src="https://unpkg.com/html5-qrcode/minified/html5-qrcode.min.js"></script>

  <script>
    let scannedData = [];

    document.getElementById("start-scan").addEventListener("click", function() {
      // Toggle visibility of camera scanner
      const qrReader = document.getElementById("qr-reader");
      qrReader.style.display = "block";

      // Initialize QR code scanner
      const html5QrCode = new Html5Qrcode("qr-reader");

      // Start the camera
      html5QrCode.start(
        { facingMode: "environment" },  // Use rear camera
        {
          fps: 10, // frames per second
          qrbox: 250 // size of the scanning box
        },
        (decodedText, decodedResult) => {
          // Push the scanned QR code text into the list
          scannedData.push(decodedText);

          // Sort the list in ascending order
          scannedData.sort();

          // Update the displayed list
          const qrCodeList = document.getElementById("qr-code-list");
          qrCodeList.innerHTML = '';  // Clear the list before re-rendering

          scannedData.forEach(data => {
            const li = document.createElement("li");
            li.textContent = data;
            qrCodeList.appendChild(li);
          });
        },
        (errorMessage) => {
          // Handle any errors, if necessary
        }
      ).catch(err => {
        console.error("Error starting QR scanner: ", err);
      });
    });
  </script>
</body>
</html>
